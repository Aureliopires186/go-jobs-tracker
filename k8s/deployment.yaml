

apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-jobs-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-jobs-tracker
  template:
    metadata:
      labels:
        app: go-jobs-tracker
    spec:
      containers:
            - name: scraper
        image: ghcr.io/aureliopires186/go-jobs-tracker:latest
        ports:
                - containerPort: 2112
        env:
                - name: SERPAPI_KEY
          valueFrom:
            secretKeyRef:
              name: scraper-secrets
              key: serpapi-key
        livenessProbe:
          httpGet:
            path: /healthz
            port: 2112
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: 2112
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: go-jobs-tracker-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "2112"
spec:
  selector:
    app: go-jobs-tracker
  ports:
    - port: 2112
    targetPort: 2112
  type: ClusterIP
